name: Build Windows EXE

# 触发条件：push 到 main / 手动触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest  # GitHub 提供的 Windows Server 2022 虚拟机

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 运行核心逻辑测试（可选）
        run: |
          python test_logic.py
        continue-on-error: true  # 测试失败不阻塞打包

      - name: 🔨 PyInstaller 打包
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "财务分析工具" `
            --hidden-import PyQt5.sip `
            --hidden-import openpyxl.cell._writer `
            --collect-all pdfplumber `
            --noconfirm `
            main.py

      - name: 📤 上传 .exe 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 财务分析工具-windows-exe
          path: dist/财务分析工具.exe
          retention-days: 30  # 保留 30 天
          if-no-files-found: error

      - name: 🏷️ 创建 Release（仅 push 到 main 时）
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/财务分析工具.exe
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
