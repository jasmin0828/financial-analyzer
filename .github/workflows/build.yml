name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python test_logic.py
        continue-on-error: true

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "FinancialAnalyzer" \
            --hidden-import PyQt5.sip \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtWidgets \
            --hidden-import openpyxl.cell._writer \
            --collect-all pdfplumber \
            --noconfirm \
            main.py

      - name: Rename exe
        shell: bash
        run: mv dist/FinancialAnalyzer.exe dist/财务分析工具.exe 2>/dev/null || cp dist/FinancialAnalyzer.exe dist/财务分析工具.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Analyzer-Windows
          path: dist/财务分析工具.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="v$(date +'%Y%m%d-%H%M%S')"
          echo "Creating release: $tag"
          gh release create "$tag" \
            "./dist/财务分析工具.exe" \
            --title "Financial Analyzer $tag" \
            --generate-notes \
            2>&1 || echo "Release creation skipped (artifact still available)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
