name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -E '^__version__' _version.py | head -1 | cut -d'"' -f2 || echo "unknown")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Detected version: ${VERSION}"

      - name: Run tests
        run: python test_logic.py
        continue-on-error: true

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "FinancialAnalyzer" \
            --hidden-import PyQt5.sip \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtWidgets \
            --hidden-import openpyxl.cell._writer \
            --collect-all pdfplumber \
            --noconfirm \
            main.py

      - name: Rename exe
        shell: bash
        run: |
          if [ -f dist/FinancialAnalyzer.exe ]; then
            mv dist/FinancialAnalyzer.exe dist/财务分析工具.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Financial-Analyzer-Windows
          path: dist/财务分析工具.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && steps.get_version.outputs.VERSION != 'unknown'
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          tag="v${VERSION}"
          echo "Creating release: $tag"
          gh release create "$tag" \
            "./dist/财务分析工具.exe" \
            --title "财务分析工具 v${VERSION}" \
            --notes "## 财务分析工具 v${VERSION}

          ## 主要功能
          - 多年财报支持（3+ 年趋势分析）
          - 42 项财务指标
          - 趋势分析（YoY + CAGR）
          - Excel 原生图表
          - 科目表导出（宽+长+CSV）
          - 原始报表(万元) Sheet
          - 原始数据 Sheet 完整保留
          - A 股双栏布局智能识别
          - 年初余额自动补充

          ## 隐私保护
          - 全本地运行，数据不外传" \
            2>&1 || echo "Release creation skipped (artifact still available)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
